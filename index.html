<!-- FILE: index.html -->
<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>

body{
font-family:Arial;
margin:0;
padding:10px;
background:#f2f2f2;
}

.main{
background:#fff;
padding:10px;
border-radius:10px;
box-shadow:0 0 8px rgba(0,0,0,.2);
}

h2{
text-align:center;
font-size:20px;
margin:5px 0 10px;
color:#003366;
}

.topbox input{
width:100%;
padding:10px;
margin:5px 0;
box-sizing:border-box;
font-size:16px;
}

.tablewrap{
overflow-x:auto;
}

table{
border-collapse:collapse;
min-width:1100px;
width:100%;
background:white;
}

th,td{
border:1px solid #000;
padding:5px;
text-align:center;
font-size:13px;
}

input.tbl{
width:65px;
padding:6px;
font-size:14px;
text-align:center;
}

.left{
text-align:left;
padding-left:5px;
min-width:220px;
}

button{
width:100%;
padding:14px;
font-size:18px;
background:#0066cc;
color:white;
border:none;
margin-top:15px;
border-radius:8px;
position:sticky;
bottom:0;
}

button:hover{
background:#004999;
}

</style>
</head>

<body>

<div class="main">

<h2>विद्यालय विषयवार रिक्ति प्रतिवेदन</h2>

<div class="topbox">

<input type="text" id="school" placeholder="विद्यालय नाम / School Name">

<input type="text" id="udise" placeholder="UDISE Code">

<input type="text" id="block" placeholder="प्रखंड / Block">

<input type="number" id="students" placeholder="Students">

</div>

<div class="tablewrap">

<table>

<tr>
<th rowspan="2">Sl</th>
<th rowspan="2">Subject</th>
<th rowspan="2">Post</th>
<th colspan="3">Working</th>
<th rowspan="2">Vacant</th>
</tr>

<tr>
<th>Regular</th>
<th>BPSC</th>
<th>PRI</th>
</tr>

<tbody id="rows"></tbody>

</table>

</div>

<button onclick="saveNow()">Submit Data</button>

</div>

<script>

const subjects=[

"Accountancy",
"Arabic",
"Bangla",
"Bhojpuri",
"Botany",
"Business Studies",
"Chemistry",
"Computer Science",
"Economics",
"English",
"Entrepreneurship",
"Environment Studies",
"Geography",
"Hindi",
"History",
"Home Science",
"Magahi",
"Maithili",
"Mathematics",
"Music",
"Pali",
"Persian",
"Philosophy",
"Physical Education",
"Physics",
"Political Science",
"Prakrit",
"Psychology",
"Sanskrit",
"Sociology",
"Urdu",
"Zoology"

];

let html="";

for(let i=0;i<subjects.length;i++){

html+=`
<tr>
<td>${i+1}</td>
<td class="left">${subjects[i]}</td>
<td><input class="tbl" type="number" id="p${i}" onkeyup="calc(${i})"></td>
<td><input class="tbl" type="number" id="r${i}" onkeyup="calc(${i})"></td>
<td><input class="tbl" type="number" id="b${i}" onkeyup="calc(${i})"></td>
<td><input class="tbl" type="number" id="pr${i}" onkeyup="calc(${i})"></td>
<td><input class="tbl" type="number" id="v${i}" readonly></td>
</tr>
`;

}

document.getElementById("rows").innerHTML=html;

function calc(i){

let p=Number(document.getElementById("p"+i).value)||0;
let r=Number(document.getElementById("r"+i).value)||0;
let b=Number(document.getElementById("b"+i).value)||0;
let pr=Number(document.getElementById("pr"+i).value)||0;

document.getElementById("v"+i).value=p-(r+b+pr);

}

function saveNow(){

var obj={};

obj.school=document.getElementById("school").value;
obj.udise=document.getElementById("udise").value;
obj.block=document.getElementById("block").value;
obj.students=document.getElementById("students").value;

obj.subjects=[];

for(let i=0;i<subjects.length;i++){

obj.subjects.push({

name:subjects[i],
post:document.getElementById("p"+i).value,
regular:document.getElementById("r"+i).value,
bpsc:document.getElementById("b"+i).value,
pri:document.getElementById("pr"+i).value,
vacant:document.getElementById("v"+i).value

});

}

google.script.run
.withSuccessHandler(function(msg){
alert("Saved Successfully");
location.reload();
})
.withFailureHandler(function(err){
alert(err.message);
})
.saveForm(obj);

}

</script>

</body>
</html>

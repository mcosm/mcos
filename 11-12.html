<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>विद्यालयवार एवं विषयवार रिक्ति प्रतिवेदन</title>

<style>
body{font-family:Arial;margin:10px;background:#f5f8ff}
.title{text-align:center;font-weight:bold;font-size:20px;margin-bottom:8px}
.tabs{display:flex;flex-wrap:wrap}
.tab{padding:8px;background:#ccc;margin:2px;cursor:pointer}
.tab.active{background:#444;color:#fff}
.table-container{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:900px;background:#fff}
th,td{border:1px solid #000;padding:4px;text-align:center;font-size:12px}
input,select{width:100%;border:none;text-align:center;padding:4px;box-sizing:border-box}
.totalRow{font-weight:bold;background:#eee}
button{
padding:12px;
margin-top:10px;
width:100%;
font-size:16px;
background:#0066cc;
color:#fff;
border:none;
cursor:pointer
}
button:disabled{opacity:.6}
#msg{text-align:center;margin-top:8px;font-weight:bold}
</style>
</head>

<body>

<div class="title">विद्यालयवार एवं विषयवार रिक्ति प्रतिवेदन</div>

<table>
<tr>
<td>प्रखंड</td>
<td>
<select id="block">
<option>SELECT</option>
<option>AMARPUR</option>
<option>BARAHAT</option>
<option>BANKA</option>
<option>BELHAR</option>
<option>BOUNSI</option>
<option>CHANDAN</option>
<option>DHORAIYA</option>
<option>FULLIDUMAR</option>
<option>KATORIYA</option>
<option>RAJOUN</option>
<option>SHAMBHUGANJ</option>
</select>
</td>
</tr>
<tr><td>विद्यालय</td><td><input id="school"></td></tr>
<tr><td>UDISE</td><td><input id="udise"></td></tr>
<tr><td>पंचायत</td><td><input id="panchayat"></td></tr>
<tr><td>प्रधान</td><td><input id="head"></td></tr>
<tr><td>मोबाइल</td><td><input id="mobile"></td></tr>
</table>

<div class="tabs">
<div class="tab active" onclick="showTab(0)">01-05</div>
<div class="tab" onclick="showTab(1)">06-08</div>
<div class="tab" onclick="showTab(2)">09-10</div>
<div class="tab" onclick="showTab(3)">11-12</div>
</div>

<div id="sections"></div>

<button id="submitBtn" onclick="submitAll()">Submit</button>
<div id="msg"></div>

<script>

/* =====================================
CHANGE THIS URL ONLY
===================================== */
const scriptURL =
"https://script.google.com/macros/s/AKfycbyAsoyoha2LPhJs_GaY2v3McKX4FxJrYg6RQWoBbV3RfOnp6UflVIcU3mMUh-qITcTO/exec";

/* ===================================== */

function showTab(i){
document.querySelectorAll(".tab").forEach((t,idx)=>t.classList.toggle("active", idx===i));
document.querySelectorAll(".section").forEach((s,idx)=>s.style.display = idx===i ? "block":"none");
}

function createTable(subjects){

let html=`
<div class="section" style="display:none">
<div class="table-container">
<table>
<tr>
<th rowspan="2">क्र०</th>
<th rowspan="2">विषय</th>
<th rowspan="2">छात्र संख्या</th>
<th rowspan="2">स्वीकृत पद</th>
<th colspan="4">कार्यरत पद</th>
<th rowspan="2">कुल कार्यरत</th>
<th rowspan="2">रिक्त पद</th>
<th rowspan="2">प्रतिनियुक्त</th>
</tr>
<tr>
<th>नियमित</th>
<th>विशिष्ट शिक्षक</th>
<th>TRE</th>
<th>नियोजित</th>
</tr>
`;

subjects.forEach((s,i)=>{
html+=`
<tr>
<td>${i+1}</td>
<td>${s}</td>
<td><input></td>
<td><input></td>
<td><input></td>
<td><input></td>
<td><input></td>
<td><input></td>
<td><input readonly></td>
<td><input readonly></td>
<td><input></td>
</tr>
`;
});

html+=`
<tr class="totalRow">
<td colspan="2">Total</td>
<td class="sum"></td>
<td class="sum"></td>
<td class="sum"></td>
<td class="sum"></td>
<td class="sum"></td>
<td class="sum"></td>
<td class="sum"></td>
<td class="sum"></td>
<td class="sum"></td>
</tr>
</table>
</div>
</div>
`;

return html;
}

/* SUBJECTS */
let sectionsHTML="";

sectionsHTML += createTable([
"Bangla","General","Physical Education","Urdu"
]);

sectionsHTML += createTable([
"English","Hindi","Mathematics and Science",
"Physical Education","Sanskrit","Social studies","Urdu"
]);

sectionsHTML += createTable([
"Arabic","Bangla","Commerce","Economics","English",
"Hindi","Mathematics","Music","Science","Social Science","Urdu"
]);

sectionsHTML += createTable([
"Accountancy","Arabic","Bangla","Bhojpuri","Botany",
"Business Studies","Chemistry","Computer Science","Economics",
"English","Entrepreneurship","Environment studies",
"Geography","Hindi","History","Home Science","Magahi",
"Maithili","Mathematics","Music","Pali","Persian",
"Philosophy","Physical Education","Physics",
"Political Science","Prakrit","Psychology",
"Sanskrit","Sociology","Urdu","Zoology"
]);

document.getElementById("sections").innerHTML=sectionsHTML;
document.querySelectorAll(".section")[0].style.display="block";

/* CALCULATION */
document.querySelectorAll(".section table").forEach(table=>{

table.addEventListener("input",()=>{

let rows=table.rows;

for(let i=2;i<rows.length-1;i++){

let inp=rows[i].querySelectorAll("input");

let san = Number(inp[1].value||0);

let works =
Number(inp[2].value||0)+
Number(inp[3].value||0)+
Number(inp[4].value||0)+
Number(inp[5].value||0);

inp[6].value = works;
inp[7].value = san - works;

}

/* TOTAL */
let sums=Array(9).fill(0);

for(let i=2;i<rows.length-1;i++){
let inp=rows[i].querySelectorAll("input");
for(let j=0;j<9;j++){
sums[j]+=Number(inp[j].value||0);
}
}

let sumCells=rows[rows.length-1].querySelectorAll(".sum");

sumCells.forEach((c,i)=>c.innerText=sums[i]||"");

});

});

/* SUBMIT TO GOOGLE SHEET */
function submitAll(){

let btn=document.getElementById("submitBtn");
let msg=document.getElementById("msg");

btn.disabled=true;
msg.innerHTML="Submitting...";

let data=[];

document.querySelectorAll(".section").forEach((sec,idx)=>{

let rows=sec.querySelectorAll("tr");

for(let i=2;i<rows.length-1;i++){

let c=rows[i].querySelectorAll("input");

data.push({

block:document.getElementById("block").value,
school:document.getElementById("school").value,
udise:document.getElementById("udise").value,
panchayat:document.getElementById("panchayat").value,
head:document.getElementById("head").value,
mobile:document.getElementById("mobile").value,

section:idx,
subject:rows[i].cells[1].innerText,

students:c[0].value,
sanction:c[1].value,
regular:c[2].value,
special:c[3].value,
tre:c[4].value,
niyojit:c[5].value,
total:c[6].value,
vacancy:c[7].value,
deputed:c[8].value

});

}

});

fetch(scriptURL,{
method:"POST",
headers:{
"Content-Type":"text/plain;charset=utf-8"
},
body:JSON.stringify(data)
})
.then(r=>r.text())
.then(res=>{
msg.innerHTML="Data Saved Successfully ✅";
setTimeout(()=>location.reload(),1200);
})
.catch(err=>{
msg.innerHTML="Error Submitting ❌";
btn.disabled=false;
});

}

</script>

</body>
</html>
